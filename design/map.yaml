# QuantumRisk map — The Mainboard (see map.md)
# Connections are undirected; each one is listed once under `connections`.

name: The Mainboard

clusters:
  CPU:
    bonus: 4
    sectors:
      - Core 0
      - Core 1
      - Core 2
      - Core 3
      - Memory Controller
      - PCIe Root
  GPU:
    bonus: 3
    sectors:
      - PCIe Slot
      - Shader Array
      - VRAM
      - Display Out
      - Power Connector
  RAM:
    bonus: 3
    sectors:
      - Memory Bus
      - DIMM A1
      - DIMM A2
      - DIMM B2
      - DIMM B1
