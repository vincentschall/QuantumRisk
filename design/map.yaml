    bonus: 2
    sectors:
      - M.2 Slot
      - Controller
      - Cache
      - NAND
  PSU:
    bonus: 3
    sectors:
      - EPS 8-Pin
      - VRM
      - ATX 24-Pin
      - PCIe Power Cable

